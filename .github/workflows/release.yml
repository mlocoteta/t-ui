# Tag-triggered GitHub Release: push a tag vX.Y.Z (matching Brand.VERSION_NAME) -> build both APKs signed with the
# release key from encrypted secrets, verify signatures, write SHA256SUMS, create a DRAFT release for a human to publish.
# Secrets (Settings -> Secrets and variables -> Actions): TUI_RELEASE_KEYSTORE_B64, TUI_KEYSTORE_PASS, TUI_KEY_ALIAS,
# TUI_KEY_PASS (optional). See docs/RELEASING.md. No key material is ever stored in the repository.
name: release
on:
  push:
    tags: ['v*']
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK pieces
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-17" "build-tools;34.0.0" > /dev/null
      - name: Tag matches the app version
        run: |
          V=$(sed -n 's/.*VERSION_NAME = "\(.*\)";.*/\1/p' core/src/org/tuiapp/core/Brand.java)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$V (Brand.java)"; exit 1; }
          echo "VER=$V" >> "$GITHUB_ENV"
      - name: Tests and privacy checks
        run: |
          tools/hosttest.sh
          TUI_NO_PRIVATE_MARKERS=1 tools/clean-export-check.sh
          tools/secret-scan.sh
      - name: Release key from secrets (runner temp only)
        env: { KS_B64: '${{ secrets.TUI_RELEASE_KEYSTORE_B64 }}' }
        run: |
          [ -n "$KS_B64" ] || { echo "release key secret missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TUI_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APKs
        env:
          TUI_RELEASE: '1'
          TUI_KEYSTORE_PASS: '${{ secrets.TUI_KEYSTORE_PASS }}'
          TUI_KEY_ALIAS: '${{ secrets.TUI_KEY_ALIAS }}'
          TUI_KEY_PASS: '${{ secrets.TUI_KEY_PASS }}'
        run: |
          mkdir -p dist
          OUT_APK="$PWD/dist/t-ui-$VER-lean.apk" tools/build.sh
          OUT_APK="$PWD/dist/t-ui-$VER-maplibre.apk" TUI_GRADLE=./gradlew TUI_GRADLE_WORK=$RUNNER_TEMP/tui-gradle tools/gradle-build.sh
      - name: Verify signatures + checksums
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          for f in dist/*.apk; do "$BT/apksigner" verify --print-certs "$f" | tee -a dist/signing-certs.txt; done
          (cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Draft release (a human publishes it)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          awk -v v="$VER" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > dist/notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "T-UI $VER" --notes-file dist/notes.md \
            dist/*.apk dist/SHA256SUMS dist/signing-certs.txt
